<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Welcome to TractPitch Pro</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --navy:  #0f172a;
      --blue:  #3b82f6;
      --green: #16a34a;
      --green-bg: #f0fdf4;
      --white: #ffffff;
      --gray-400: #94a3b8;
      --gray-600: #475569;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--navy);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px;
      text-align: center;
    }
    .icon {
      width: 72px;
      height: 72px;
      background: var(--green-bg);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 28px;
    }
    .icon svg { color: var(--green); }
    h1 {
      font-size: clamp(1.5rem, 4vw, 2.25rem);
      font-weight: 800;
      color: var(--white);
      letter-spacing: -0.025em;
      margin-bottom: 14px;
    }
    p {
      font-size: 1rem;
      color: rgba(255,255,255,0.6);
      max-width: 440px;
      line-height: 1.65;
      margin-bottom: 36px;
    }
    .btn {
      display: inline-block;
      padding: 13px 28px;
      background: var(--blue);
      color: var(--white);
      font-size: 0.9375rem;
      font-weight: 700;
      border-radius: 8px;
      text-decoration: none;
      transition: opacity 0.15s;
    }
    .btn:hover { opacity: 0.88; }
    .sub {
      margin-top: 20px;
      font-size: 0.8rem;
      color: rgba(255,255,255,0.28);
    }
  </style>
</head>
<body>
  <div class="icon">
    <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="20 6 9 17 4 12"/>
    </svg>
  </div>
  <h1>You're on TractPitch Pro</h1>
  <p>Your subscription is confirmed. You now have unlimited grant searches, HUD designation lookups, live deadlines, and full federal funding history.</p>
  <a href="/screener" class="btn">Open Grant Screener</a>
  <p class="sub">A receipt has been sent to your email by Stripe.</p>
</body>
</html>
