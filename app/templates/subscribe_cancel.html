<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout Cancelled — TractPitch</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --navy:  #0f172a;
      --blue:  #3b82f6;
      --white: #ffffff;
      --gray-400: #94a3b8;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--navy);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px;
      text-align: center;
    }
    .icon {
      width: 72px;
      height: 72px;
      background: rgba(255,255,255,0.06);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 28px;
    }
    .icon svg { color: var(--gray-400); }
    h1 {
      font-size: clamp(1.5rem, 4vw, 2.25rem);
      font-weight: 800;
      color: var(--white);
      letter-spacing: -0.025em;
      margin-bottom: 14px;
    }
    p {
      font-size: 1rem;
      color: rgba(255,255,255,0.6);
      max-width: 420px;
      line-height: 1.65;
      margin-bottom: 36px;
    }
    .actions {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .btn-primary {
      display: inline-block;
      padding: 13px 28px;
      background: var(--blue);
      color: var(--white);
      font-size: 0.9375rem;
      font-weight: 700;
      border-radius: 8px;
      text-decoration: none;
      transition: opacity 0.15s;
    }
    .btn-primary:hover { opacity: 0.88; }
    .btn-ghost {
      display: inline-block;
      padding: 12px 28px;
      background: transparent;
      color: rgba(255,255,255,0.6);
      font-size: 0.9375rem;
      font-weight: 500;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.15);
      text-decoration: none;
      transition: border-color 0.15s, color 0.15s;
    }
    .btn-ghost:hover { color: var(--white); border-color: rgba(255,255,255,0.35); }
  </style>
</head>
<body>
  <div class="icon">
    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"/>
      <line x1="15" y1="9" x2="9" y2="15"/>
      <line x1="9" y1="9" x2="15" y2="15"/>
    </svg>
  </div>
  <h1>Checkout cancelled</h1>
  <p>No charge was made. You can try again anytime or continue using the free plan.</p>
  <div class="actions">
    <a href="/#pricing" class="btn-primary">Try Again</a>
    <a href="/screener" class="btn-ghost">Use Free Plan</a>
  </div>
</body>
</html>
